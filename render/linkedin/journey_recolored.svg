<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="95%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0EAD9"/>
    </radialGradient>
    <!-- color blocks for the 6 stages -->
    <linearGradient id="block1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EC8C0"/><stop offset="1" stop-color="#2FA6A6"/></linearGradient>
    <linearGradient id="block2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8A24A"/><stop offset="1" stop-color="#E0852A"/></linearGradient>
    <linearGradient id="block3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A6EA5"/><stop offset="1" stop-color="#2C4F7C"/></linearGradient>
    <linearGradient id="block4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F08A4D"/><stop offset="1" stop-color="#E8651A"/></linearGradient>
    <linearGradient id="block5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3AA5B0"/><stop offset="1" stop-color="#148A99"/></linearGradient>
    <linearGradient id="block6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6B7A"/><stop offset="1" stop-color="#1B2A3A"/></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#8A8578" stroke-width="1" opacity="0.22">
    <line x1="1060" y1="200" x2="1060" y2="720"/>
    <line x1="1240" y1="180" x2="1240" y2="740"/>
    <line x1="1440" y1="220" x2="1440" y2="700"/>
    <line x1="900" y1="250" x2="1560" y2="250"/>
    <line x1="900" y1="620" x2="1560" y2="620"/>
  </g>

  <!-- headings -->
  <text x="800" y="130" text-anchor="middle" font-size="64" font-weight="800" fill="#14100B">From Token <tspan fill="#E8651A">to</tspan> Fleet</text>
  <text x="800" y="192" text-anchor="middle" font-size="30" fill="#3D463E">An AI Solution Architect's Handbook</text>
  <text x="800" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#E8651A">— Zhiqi Tao —</text>

  <!-- connecting streams (soft on cream) -->
  <g stroke="#A7A293" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M185,478 C230,468 260,470 298,478"/>
    <path d="M185,482 C230,492 260,490 298,482"/>
    <path d="M185,480 C240,480 260,480 300,480"/>
    <path d="M450,470 C480,460 500,462 520,466"/>
    <path d="M450,490 C480,500 500,498 520,494"/>
    <path d="M452,480 L520,480"/>
    <path d="M680,470 C705,462 715,462 735,468"/>
    <path d="M680,490 C705,498 715,498 735,492"/>
    <path d="M680,480 L735,480"/>
    <path d="M905,470 C925,462 935,462 955,468"/>
    <path d="M905,490 C925,498 935,498 955,492"/>
    <path d="M905,480 L955,480"/>
    <path d="M1135,470 C1160,455 1180,450 1200,445"/>
    <path d="M1135,490 C1160,505 1180,510 1200,515"/>
    <path d="M1135,480 L1200,480"/>
  </g>

  <!-- COLOR BLOCKS behind each stage -->
  <g>
    <rect x="108" y="400" width="115" height="160" rx="30" fill="url(#block1)"/>
    <rect x="278" y="415" width="185" height="130" rx="30" fill="url(#block2)"/>
    <rect x="508" y="368" width="185" height="220" rx="30" fill="url(#block3)"/>
    <rect x="723" y="362" width="195" height="232" rx="30" fill="url(#block4)"/>
    <rect x="943" y="358" width="204" height="240" rx="30" fill="url(#block5)"/>
    <rect x="1188" y="318" width="285" height="300" rx="34" fill="url(#block6)"/>
  </g>

  <!-- 1. token: a single sand grain -->
  <g>
    <circle cx="165" cy="480" r="22" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="165" cy="480" r="7" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="1.8" opacity="0.9">
      <line x1="165" y1="454" x2="165" y2="462"/><line x1="165" y1="498" x2="165" y2="506"/>
      <line x1="139" y1="480" x2="147" y2="480"/><line x1="183" y1="480" x2="191" y2="480"/>
    </g>
    <!-- loose sand grains around -->
    <g fill="#F5B75B" opacity="0.95">
      <circle cx="118" cy="438" r="3"/><circle cx="140" cy="544" r="2"/><circle cx="200" cy="446" r="2.5"/>
      <circle cx="212" cy="512" r="2"/><circle cx="150" cy="430" r="2"/><circle cx="176" cy="548" r="2.5"/>
    </g>
  </g>

  <!-- 2. workload: strands coming together -->
  <g stroke="#FFFFFF" stroke-width="1.6" opacity="0.9" fill="none">
    <path d="M300,480 L335,462 L376,443 L412,458 L448,480"/>
    <path d="M300,480 L335,498 L376,517 L412,502 L448,480"/>
    <path d="M335,462 L335,498 M376,443 L376,517 M412,458 L412,502"/>
    <path d="M335,462 L412,502 M335,498 L412,458"/>
  </g>
  <g fill="#FFF3D6">
    <circle cx="300" cy="480" r="3"/><circle cx="335" cy="462" r="4"/><circle cx="335" cy="498" r="4"/>
    <circle cx="376" cy="443" r="4.5"/><circle cx="376" cy="517" r="4.5"/><circle cx="412" cy="458" r="4"/>
    <circle cx="412" cy="502" r="4"/><circle cx="448" cy="480" r="3"/>
  </g>

  <!-- 3. compute & memory: chip -->
  <g stroke="#DCE9F5" fill="none">
    <rect x="520" y="392" width="160" height="172" rx="24" stroke-width="3"/>
    <rect x="572" y="444" width="56" height="56" rx="6" stroke-width="3"/>
    <rect x="590" y="462" width="20" height="20" stroke-width="2.5" fill="#FFFFFF" opacity="0.25"/>
    <g stroke-width="2.5">
      <line x1="584" y1="444" x2="584" y2="432"/><line x1="600" y1="444" x2="600" y2="432"/><line x1="616" y1="444" x2="616" y2="432"/>
      <line x1="584" y1="500" x2="584" y2="512"/><line x1="600" y1="500" x2="600" y2="512"/><line x1="616" y1="500" x2="616" y2="512"/>
      <line x1="572" y1="456" x2="560" y2="456"/><line x1="572" y1="472" x2="560" y2="472"/><line x1="572" y1="488" x2="560" y2="488"/>
      <line x1="628" y1="456" x2="640" y2="456"/><line x1="628" y1="472" x2="640" y2="472"/><line x1="628" y1="488" x2="640" y2="488"/>
    </g>
  </g>

  <!-- 4. parallelism: fan-out -->
  <g stroke="#FFF1E2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="772" y1="478" x2="856" y2="478"/>
    <path d="M782,478 C810,478 812,452 846,448"/>
    <path d="M782,478 C810,478 812,504 846,508"/>
  </g>
  <g fill="#FFFFFF">
    <polygon points="872,478 852,470 852,486"/>
    <polygon points="866,448 846,440 846,456"/>
    <polygon points="866,508 846,500 846,516"/>
  </g>

  <!-- 5. serving & SLOs: rack -->
  <g stroke="#E3F0F1" fill="none">
    <g stroke-width="2.6">
      <rect x="985" y="412" width="108" height="32" rx="5"/>
      <rect x="985" y="454" width="108" height="32" rx="5"/>
      <rect x="985" y="496" width="108" height="32" rx="5"/>
    </g>
    <g stroke-width="2">
      <line x1="997" y1="421" x2="997" y2="433"/><line x1="1007" y1="421" x2="1007" y2="433"/><line x1="1017" y1="421" x2="1017" y2="433"/><line x1="1027" y1="421" x2="1027" y2="433"/>
      <line x1="997" y1="463" x2="997" y2="475"/><line x1="1007" y1="463" x2="1007" y2="475"/><line x1="1017" y1="463" x2="1017" y2="475"/><line x1="1027" y1="463" x2="1027" y2="475"/>
      <line x1="997" y1="505" x2="997" y2="517"/><line x1="1007" y1="505" x2="1007" y2="517"/><line x1="1017" y1="505" x2="1017" y2="517"/><line x1="1027" y1="505" x2="1027" y2="517"/>
    </g>
    <circle cx="1080" cy="428" r="3.5" fill="#FFE6C2"/><circle cx="1080" cy="470" r="3.5" fill="#FFE6C2"/><circle cx="1080" cy="512" r="3.5" fill="#FFE6C2"/>
  </g>

  <!-- 6. fleet: dense mesh, most complex -->
  <g stroke="#DFE8EE" stroke-width="1.6" fill="none">
    <path d="M1250,395 L1310,375 L1385,385 L1425,410 M1250,395 L1240,455 M1310,375 L1300,440 M1385,385 L1360,445 M1425,410 L1420,470
         M1240,455 L1300,440 L1360,445 L1420,470 M1240,455 L1255,520 M1300,440 L1320,505 M1360,445 L1385,515 M1420,470 L1430,540
         M1255,520 L1320,505 L1385,515 L1430,540 M1255,520 L1260,575 M1320,505 L1330,570 M1385,515 L1395,575
         M1260,575 L1330,570 L1395,575 L1430,540 M1310,375 L1360,445 M1250,395 L1300,440"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="1250" cy="395" r="5"/><circle cx="1310" cy="375" r="5"/><circle cx="1385" cy="385" r="5"/><circle cx="1425" cy="410" r="5"/>
    <circle cx="1240" cy="455" r="5"/><circle cx="1300" cy="440" r="5"/><circle cx="1360" cy="445" r="5"/><circle cx="1420" cy="470" r="5"/>
    <circle cx="1255" cy="520" r="5"/><circle cx="1320" cy="505" r="5"/><circle cx="1385" cy="515" r="5"/><circle cx="1430" cy="540" r="5"/>
    <circle cx="1260" cy="575" r="5"/><circle cx="1330" cy="570" r="5"/><circle cx="1395" cy="575" r="5"/>
  </g>
  <g fill="#F5B75B">
    <circle cx="1310" cy="375" r="3"/><circle cx="1360" cy="445" r="3"/><circle cx="1395" cy="575" r="3"/><circle cx="1240" cy="455" r="3"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle" font-size="26" font-weight="800" fill="#14100B" letter-spacing="1">
    <text x="165" y="612">TOKEN</text>
    <text x="370" y="612">WORKLOAD</text>
    <text x="600" y="612">COMPUTE &amp; MEMORY</text>
    <text x="820" y="612">PARALLELISM</text>
    <text x="1050" y="612">SERVING &amp; SLOs</text>
    <text x="1330" y="612">FLEET</text>
  </g>
  <!-- stage sub-notes (worked values) -->
  <g text-anchor="middle" font-size="17" font-weight="600" fill="#6A6F66" letter-spacing="0.5">
    <text x="165" y="640">KV · 2.5 MB</text>
    <text x="370" y="640">6-dim</text>
    <text x="600" y="640">140 GB + KV</text>
    <text x="820" y="640">TP · PP · EP</text>
    <text x="1050" y="640">TTFT · TPOT</text>
    <text x="1330" y="640">N hosts</text>
  </g>

  <!-- tagline -->
  <text x="800" y="800" text-anchor="middle" font-size="26" font-weight="700" fill="#14100B">
    Layer by layer, decision by decision — <tspan fill="#E8651A">from the first token to the whole fleet</tspan>
  </text>
</svg>