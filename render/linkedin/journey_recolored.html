<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;}
  body{background:#F4F1EA;font-family:'Inter','Segoe UI',Arial,sans-serif;}
  .wrap{width:1600px;height:900px;position:relative;overflow:hidden;padding:76px 40px 0;box-sizing:border-box;}
  .wrap::before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:
    repeating-linear-gradient(0deg,rgba(138,133,120,0.10) 0 1px,transparent 1px 56px),
    repeating-linear-gradient(90deg,rgba(138,133,120,0.10) 0 1px,transparent 1px 56px);}
  .head{text-align:center;position:relative;z-index:2;}
  .title{font-size:60px;font-weight:800;color:#14100B;letter-spacing:-0.01em;}
  .title .accent{color:#E8651A;}
  .subtitle{margin-top:10px;font-size:29px;color:#3D463E;}
  .author{margin-top:8px;font-size:26px;font-weight:700;color:#E8651A;}
  .flow{margin-top:46px;position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;}
  .stage{flex:1 1 0;max-width:250px;text-align:center;padding:0 6px;display:flex;flex-direction:column;align-items:center;}
  .tilezone{height:200px;width:100%;position:relative;}
  .tile{position:absolute;left:50%;transform:translateX(-50%);bottom:0;margin:0;}
  .label{margin-top:18px;font-size:21px;font-weight:800;color:#14100B;letter-spacing:1px;line-height:1.15;}
  .arrow{align-self:center;flex:0 0 28px;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:42px;}
  .arrow svg{display:block;}
  .footer{margin-top:44px;text-align:center;position:relative;z-index:2;}
  .tagline{font-size:25px;font-weight:700;color:#14100B;}
  .tagline .dash{color:#E8651A;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">From Token <span class="accent">to</span> Fleet</div>
    <div class="subtitle">An AI Solution Architect's Handbook</div>
    <div class="author">— Zhiqi Tao —</div>
  </div>

  <div class="flow">
    <!-- 1 TOKEN: a sand grain -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="108" height="138" viewBox="0 0 120 150" preserveAspectRatio="xMidYMax meet">
        <rect x="4" y="0" width="112" height="150" rx="26" fill="url(#b1)"/>
        <circle cx="60" cy="68" r="24" fill="#FFFFFF" opacity="0.18"/>
        <circle cx="60" cy="68" r="8" fill="#FFFFFF"/>
        <g stroke="#FFFFFF" stroke-width="2" opacity="0.9" stroke-linecap="round">
          <line x1="60" y1="40" x2="60" y2="50"/><line x1="60" y1="86" x2="60" y2="96"/>
          <line x1="30" y1="68" x2="40" y2="68"/><line x1="80" y1="68" x2="90" y2="68"/>
          <line x1="38" y1="46" x2="46" y2="54"/><line x1="74" y1="82" x2="82" y2="90"/>
          <line x1="38" y1="90" x2="46" y2="82"/><line x1="74" y1="54" x2="82" y2="46"/>
        </g>
        <!-- loose sand -->
        <g fill="#F5B75B">
          <circle cx="20" cy="22" r="3"/><circle cx="98" cy="30" r="2.4"/><circle cx="16" cy="120" r="2.2"/><circle cx="104" cy="96" r="2.6"/><circle cx="30" cy="132" r="2"/>
        </g>
      </svg></div>
      <div class="label">TOKEN</div>
</div>

    <div class="arrow"><svg width="30" height="30"><path d="M2 15 H24 M17 7 L26 15 L17 23" stroke="#A7A293" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 2 WORKLOAD: strands assembling -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="140" height="140" viewBox="0 0 150 150" preserveAspectRatio="xMidYMax meet">
        <rect x="0" y="0" width="150" height="150" rx="28" fill="url(#b2)"/>
        <g stroke="#FFFFFF" stroke-width="1.8" opacity="0.92" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M52,75 L72,62 L96,52 L102,74"/><path d="M52,75 L72,88 L96,98 L102,76"/>
          <path d="M72,62 L72,88 M96,52 L96,98"/><path d="M72,62 L96,98 M72,88 L96,52"/>
        </g>
        <g fill="#FFF3D6">
          <circle cx="52" cy="75" r="3.5"/><circle cx="72" cy="62" r="4"/><circle cx="72" cy="88" r="4"/>
          <circle cx="96" cy="52" r="4.5"/><circle cx="96" cy="98" r="4.5"/><circle cx="102" cy="74" r="3.5"/><circle cx="102" cy="76" r="3.5"/>
        </g>
        <circle cx="86" cy="70" r="3" fill="#F5B75B"/><circle cx="84" cy="86" r="3" fill="#F5B75B"/>
      </svg></div>
      <div class="label">WORKLOAD</div>
</div>

    <div class="arrow"><svg width="30" height="30"><path d="M2 15 H24 M17 7 L26 15 L17 23" stroke="#A7A293" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 3 COMPUTE & MEMORY: chip -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="166" height="156" viewBox="0 0 170 160" preserveAspectRatio="xMidYMax meet">
        <rect x="0" y="0" width="170" height="160" rx="28" fill="url(#b3)"/>
        <g stroke="#DCE9F5" fill="none">
          <rect x="38" y="30" width="94" height="100" rx="16" stroke-width="3"/>
          <rect x="63" y="55" width="44" height="44" rx="6" stroke-width="3"/>
          <rect x="72" y="64" width="26" height="26" fill="#FFFFFF" opacity="0.22" stroke="none"/>
          <g stroke-width="2.6" stroke-linecap="round">
            <line x1="70" y1="30" x2="70" y2="22"/><line x1="85" y1="30" x2="85" y2="22"/><line x1="100" y1="30" x2="100" y2="22"/>
            <line x1="70" y1="130" x2="70" y2="138"/><line x1="85" y1="130" x2="85" y2="138"/><line x1="100" y1="130" x2="100" y2="138"/>
            <line x1="38" y1="55" x2="30" y2="55"/><line x1="38" y1="80" x2="30" y2="80"/><line x1="132" y1="55" x2="140" y2="55"/><line x1="132" y1="80" x2="140" y2="80"/>
          </g>
        </g>
      </svg></div>
      <div class="label">COMPUTE<br/>&amp; MEMORY</div>
</div>

    <div class="arrow"><svg width="30" height="30"><path d="M2 15 H24 M17 7 L26 15 L17 23" stroke="#A7A293" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 4 PARALLELISM: fan-out -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="192" height="168" viewBox="0 0 170 160" preserveAspectRatio="xMidYMax meet">
        <rect x="0" y="0" width="170" height="160" rx="28" fill="url(#b4)"/>
        <g stroke="#FFF1E2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="34" y1="80" x2="92" y2="80"/>
          <path d="M68,80 C88,80 90,58 116,52"/><path d="M68,80 C88,80 90,102 116,108"/>
        </g>
        <g fill="#FFFFFF">
          <polygon points="136,80 120,73 120,87"/>
          <polygon points="128,52 113,45 113,59"/>
          <polygon points="128,108 113,101 113,115"/>
        </g>
      </svg></div>
      <div class="label">PARALLEL<br/>SCALING</div>
</div>

    <div class="arrow"><svg width="30" height="30"><path d="M2 15 H24 M17 7 L26 15 L17 23" stroke="#A7A293" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 5 SERVING & SLOs: rack -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="218" height="176" viewBox="0 0 170 160" preserveAspectRatio="xMidYMax meet">
        <rect x="0" y="0" width="170" height="160" rx="28" fill="url(#b5)"/>
        <g stroke="#E3F0F1" fill="none">
          <g stroke-width="2.6">
            <rect x="34" y="32" width="102" height="30" rx="5"/>
            <rect x="34" y="70" width="102" height="30" rx="5"/>
            <rect x="34" y="108" width="102" height="30" rx="5"/>
          </g>
          <g stroke-width="2" stroke-linecap="round">
            <line x1="44" y1="40" x2="44" y2="51"/><line x1="53" y1="40" x2="53" y2="51"/><line x1="62" y1="40" x2="62" y2="51"/><line x1="71" y1="40" x2="71" y2="51"/>
            <line x1="44" y1="78" x2="44" y2="89"/><line x1="53" y1="78" x2="53" y2="89"/><line x1="62" y1="78" x2="62" y2="89"/><line x1="71" y1="78" x2="71" y2="89"/>
            <line x1="44" y1="116" x2="44" y2="127"/><line x1="53" y1="116" x2="53" y2="127"/><line x1="62" y1="116" x2="62" y2="127"/><line x1="71" y1="116" x2="71" y2="127"/>
          </g>
          <circle cx="128" cy="47" r="3.5" fill="#FFE6C2"/><circle cx="128" cy="85" r="3.5" fill="#FFE6C2"/><circle cx="128" cy="123" r="3.5" fill="#FFE6C2"/>
        </g>
      </svg></div>
      <div class="label">SERVING<br/>&amp; SLOs</div>
</div>

    <div class="arrow"><svg width="30" height="30"><path d="M2 15 H24 M17 7 L26 15 L17 23" stroke="#A7A293" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 6 FLEET: dense mesh -->
    <div class="stage">
      <div class="tilezone"><svg class="tile" width="246" height="186" viewBox="0 0 205 170" preserveAspectRatio="xMidYMax meet">
        <rect x="0" y="0" width="205" height="170" rx="28" fill="url(#b6)"/>
        <g stroke="#DFE8EE" stroke-width="1.6" fill="none">
          <path d="M60,42 L104,28 L152,36 L180,55 M60,42 L50,88 M104,28 L96,80 M152,36 L134,88 M180,55 L178,102
           M50,88 L96,80 L134,88 L178,102 M50,88 L60,124 M96,80 L110,108 M134,88 L146,118 M178,102 L184,126
           M60,124 L110,108 L146,118 L184,126 M60,124 L64,150 M110,108 L118,148 M146,118 L152,152
           M64,150 L118,148 L152,152 L184,126 M104,28 L134,88 M60,42 L96,80"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="60" cy="42" r="5"/><circle cx="104" cy="28" r="5"/><circle cx="152" cy="36" r="5"/><circle cx="180" cy="55" r="5"/>
          <circle cx="50" cy="88" r="5"/><circle cx="96" cy="80" r="5"/><circle cx="134" cy="88" r="5"/><circle cx="178" cy="102" r="5"/>
          <circle cx="60" cy="124" r="5"/><circle cx="110" cy="108" r="5"/><circle cx="146" cy="118" r="5"/><circle cx="184" cy="126" r="5"/>
          <circle cx="64" cy="150" r="5"/><circle cx="118" cy="148" r="5"/><circle cx="152" cy="152" r="5"/>
        </g>
        <g fill="#F5B75B">
          <circle cx="104" cy="28" r="3"/><circle cx="134" cy="88" r="3"/><circle cx="152" cy="152" r="3"/><circle cx="50" cy="88" r="3"/>
        </g>
      </svg></div>
      <div class="label">FLEET</div>
</div>
  </div>

  <div class="footer">
    <div class="tagline">Layer by layer, decision by decision — <span class="dash">from the first token to the whole fleet</span></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EC8C0"/><stop offset="1" stop-color="#2FA6A6"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8A24A"/><stop offset="1" stop-color="#E0852A"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A6EA5"/><stop offset="1" stop-color="#2C4F7C"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F08A4D"/><stop offset="1" stop-color="#E8651A"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3AA5B0"/><stop offset="1" stop-color="#148A99"/></linearGradient>
    <linearGradient id="b6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6B7A"/><stop offset="1" stop-color="#1B2A3A"/></linearGradient>
  </defs>
</svg>
<style>
  .tile{background:none;}
</style>
</body>
</html>
