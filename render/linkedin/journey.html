<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --cream:#F4F1EA; --ink:#101014; --char:#575B63;
    --orange:#E8651A; --cyan:#148A99; --slate:#5B6B7A; --navy:#1B2A3A;
    --line:#C7C2B6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);font-family:'Inter','Helvetica Neue',sans-serif;color:var(--ink);}
  .wrap{width:1600px;height:900px;padding:70px 60px 52px;position:relative;overflow:hidden;}
  .wrap::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0.45;
    background-image:repeating-linear-gradient(0deg, rgba(27,42,58,0.05) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, rgba(27,42,58,0.05) 0 1px, transparent 1px 52px);}

  .head{text-align:center;position:relative;z-index:2;}
  .title{font-size:92px;font-weight:900;letter-spacing:-0.015em;line-height:1;text-transform:uppercase;}
  .title .accent{color:var(--orange);}
  .subtitle{margin-top:14px;font-size:32px;font-weight:500;color:var(--char);letter-spacing:0.02em;}
  .author{margin-top:10px;font-size:28px;font-weight:700;color:var(--ink);}
  .author::before,.author::after{content:'—';color:var(--line);margin:0 12px;}

  .flow{margin-top:62px;position:relative;z-index:2;
    display:flex;align-items:center;justify-content:center;gap:0;}

  .stage{flex:0 0 205px;text-align:center;}
  .tile{width:146px;height:146px;margin:0 auto;border-radius:36px;position:relative;
    background:#fff;border:3px solid var(--navy);
    box-shadow:0 6px 0 rgba(27,42,58,0.12);
    display:flex;align-items:center;justify-content:center;}
  .stage-label{margin-top:24px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
  .stage-label .l1{font-size:23px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);line-height:1.08;}
  .stage-label .l2{font-size:23px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);line-height:1.08;margin-top:2px;}
  .stage-label .sub{font-size:15px;font-weight:600;color:var(--char);margin-top:7px;letter-spacing:0.02em;}

  .arrow{flex:0 0 36px;display:flex;align-items:center;justify-content:center;}
  .arrow svg{display:block;}

  .footer{margin-top:40px;text-align:center;position:relative;z-index:2;}
  .tagline{font-size:27px;font-weight:600;color:var(--navy);letter-spacing:0.01em;}
  .tagline .dash{color:var(--orange);font-weight:800;}
  .rule{width:420px;height:4px;margin:20px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--cyan) 0%,var(--orange) 60%,var(--navy) 100%);}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">From Token <span class="accent">to</span> Fleet</div>
    <div class="subtitle">An AI Solution Architect's Handbook</div>
    <div class="author">Zhiqi Tao</div>
  </div>

  <div class="flow">
    <!-- 1 TOKEN -->
    <div class="stage">
      <div class="tile">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="9" fill="#148A99"/>
          <g stroke="#148A99" stroke-width="3" stroke-linecap="round" opacity="0.7">
            <line x1="35" y1="12" x2="35" y2="24"/><line x1="35" y1="46" x2="35" y2="58"/>
            <line x1="12" y1="35" x2="24" y2="35"/><line x1="46" y1="35" x2="58" y2="35"/>
            <line x1="19" y1="19" x2="27" y2="27"/><line x1="43" y1="43" x2="51" y2="51"/>
            <line x1="19" y1="51" x2="27" y2="43"/><line x1="43" y1="27" x2="51" y2="19"/>
          </g>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">The</div><div class="l2">Token</div><div class="sub">KV · 2.5 MB</div></div>
    </div>

    <div class="arrow"><svg width="34" height="30"><path d="M2 15 H26 M20 6 L30 15 L20 24" stroke="#5B6B7A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 2 WORKLOAD -->
    <div class="stage">
      <div class="tile">
        <svg width="74" height="74" viewBox="0 0 74 74">
          <g stroke="#E8651A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M37 14 L57 28 L50 51 L24 51 L17 28 Z"/>
            <path d="M37 14 L33 24 L37 28 L41 24 Z" fill="#E8651A" stroke="none"/>
            <line x1="37" y1="28" x2="37" y2="51"/>
            <line x1="17" y1="28" x2="50" y2="51"/>
            <line x1="50" y1="51" x2="57" y2="28"/>
          </g>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">The</div><div class="l2">Workload</div><div class="sub">6-dim</div></div>
    </div>

    <div class="arrow"><svg width="34" height="30"><path d="M2 15 H26 M20 6 L30 15 L20 24" stroke="#5B6B7A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 3 COMPUTE & MEMORY -->
    <div class="stage">
      <div class="tile">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <g fill="none" stroke="#1B2A3A" stroke-width="3.5">
            <rect x="14" y="14" width="44" height="44" rx="8"/>
            <rect x="24" y="24" width="24" height="24" rx="4"/>
            <rect x="31" y="31" width="10" height="10"/>
          </g>
          <g stroke="#1B2A3A" stroke-width="2.6" stroke-linecap="round">
            <line x1="19" y1="14" x2="19" y2="7"/><line x1="29" y1="14" x2="29" y2="7"/><line x1="39" y1="14" x2="39" y2="7"/><line x1="49" y1="14" x2="49" y2="7"/>
            <line x1="19" y1="65" x2="19" y2="58"/><line x1="29" y1="65" x2="29" y2="58"/><line x1="39" y1="65" x2="39" y2="58"/><line x1="49" y1="65" x2="49" y2="58"/>
            <line x1="14" y1="24" x2="7" y2="24"/><line x1="14" y1="36" x2="7" y2="36"/><line x1="65" y1="24" x2="58" y2="24"/><line x1="65" y1="36" x2="58" y2="36"/>
          </g>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">Compute</div><div class="l2">&amp; Memory</div><div class="sub">140 GB + KV</div></div>
    </div>

    <div class="arrow"><svg width="34" height="30"><path d="M2 15 H26 M20 6 L30 15 L20 24" stroke="#5B6B7A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 4 PARALLELISM -->
    <div class="stage">
      <div class="tile">
        <svg width="74" height="74" viewBox="0 0 74 74">
          <g stroke="#E8651A" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="16" y1="37" x2="40" y2="37"/>
            <path d="M40 37 C48 37 50 22 57 16 M40 37 C48 37 50 52 57 58"/>
          </g>
          <g fill="#E8651A">
            <polygon points="63,13 55,15 55,22"/>
            <polygon points="63,61 55,52 55,59"/>
            <polygon points="40,37 47,31 47,43"/>
          </g>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">Parallel</div><div class="l2">&amp; Scaling</div><div class="sub">TP · PP · EP</div></div>
    </div>

    <div class="arrow"><svg width="34" height="30"><path d="M2 15 H26 M20 6 L30 15 L20 24" stroke="#5B6B7A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 5 SERVING & SLOs -->
    <div class="stage">
      <div class="tile">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <g fill="none" stroke="#148A99" stroke-width="3">
            <rect x="16" y="12" width="38" height="13" rx="3.5"/>
            <rect x="16" y="28.5" width="38" height="13" rx="3.5"/>
            <rect x="16" y="45" width="38" height="13" rx="3.5"/>
          </g>
          <g stroke="#148A99" stroke-width="2.4" stroke-linecap="round">
            <line x1="24" y1="16" x2="24" y2="21"/><line x1="30" y1="16" x2="30" y2="21"/><line x1="36" y1="16" x2="36" y2="21"/>
            <line x1="24" y1="32.5" x2="24" y2="37.5"/><line x1="30" y1="32.5" x2="30" y2="37.5"/><line x1="36" y1="32.5" x2="36" y2="37.5"/>
            <line x1="24" y1="49" x2="24" y2="54"/><line x1="30" y1="49" x2="30" y2="54"/><line x1="36" y1="49" x2="36" y2="54"/>
          </g>
          <circle cx="48" cy="18.5" r="3" fill="#E8651A"/>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">Serving</div><div class="l2">&amp; SLOs</div><div class="sub">TTFT · TPOT</div></div>
    </div>

    <div class="arrow"><svg width="34" height="30"><path d="M2 15 H26 M20 6 L30 15 L20 24" stroke="#5B6B7A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <!-- 6 FLEET -->
    <div class="stage">
      <div class="tile">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <g stroke="#5B6B7A" stroke-width="2.8" fill="none">
            <line x1="24" y1="22" x2="48" y2="22"/><line x1="24" y1="22" x2="24" y2="48"/>
            <line x1="24" y1="48" x2="48" y2="48"/><line x1="48" y1="48" x2="48" y2="22"/>
            <path d="M24 22 L34 30 L48 22"/>
            <line x1="34" y1="30" x2="34" y2="48"/>
          </g>
          <g fill="#5B6B7A">
            <circle cx="24" cy="22" r="5"/><circle cx="48" cy="22" r="5"/><circle cx="24" cy="48" r="5"/><circle cx="48" cy="48" r="5"/>
            <circle cx="34" cy="30" r="5"/><circle cx="34" cy="48" r="5"/><circle cx="44" cy="28" r="5"/>
          </g>
        </svg>
      </div>
      <div class="stage-label"><div class="l1">The</div><div class="l2">Fleet</div><div class="sub">N hosts</div></div>
    </div>
  </div>

  <div class="footer">
    <div class="tagline">Layer by layer, decision by decision — <span class="dash">from the first token to the whole fleet</span></div>
    <div class="rule"></div>
  </div>
</div>
</body>
</html>
