<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --cream:#F4F1EA; --ink:#101014; --char:#575B63;
    --orange:#E8651A; --cyan:#148A99; --slate:#5B6B7A; --navy:#1B2A3A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);font-family:'Inter','Helvetica Neue',sans-serif;color:var(--ink);}
  .wrap{width:1180px;padding:42px 66px 34px;position:relative;overflow:hidden;}

  .wrap::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0.5;
    background-image:repeating-linear-gradient(58deg,rgba(27,42,58,0.05) 0 1px,transparent 1px 46px),
                     repeating-linear-gradient(-58deg,rgba(27,42,58,0.05) 0 1px,transparent 1px 46px);}

  /* left margin accent spine: spans full height on the far-left gutter, clear of all text */
  .spine{position:absolute;left:30px;top:0;bottom:0;width:6px;border-radius:3px;
    background:linear-gradient(180deg,var(--orange) 0 33%,var(--cyan) 33% 66%,var(--slate) 66% 100%);opacity:0.4;}

  .titleblock{position:relative;z-index:3;margin-left:70px;}
  .titleline{font-size:104px;font-weight:900;letter-spacing:-0.028em;line-height:0.95;}
  .titleline .spark{color:var(--orange);}
  .subtitle{margin-top:14px;font-size:30px;font-weight:600;color:var(--char);letter-spacing:0.01em;}

  .stages{margin-top:38px;margin-left:70px;position:relative;z-index:2;}
  .stage{display:flex;align-items:center;gap:40px;padding:42px 0;border-top:1px solid rgba(27,42,58,0.18);min-height:118px;}
  .stage:last-of-type{border-bottom:1px solid rgba(27,42,58,0.18);}
  .stage-label{flex:0 0 230px;display:flex;flex-direction:column;justify-content:center;align-self:stretch;}
  .kicker{font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--slate);}
  .name{font-size:50px;font-weight:900;text-transform:uppercase;margin-top:2px;letter-spacing:-0.01em;line-height:1;}
  .stage-scene{flex:1;display:flex;justify-content:flex-end;align-items:center;align-self:stretch;}

  .loopwrap{margin-left:70px;display:flex;justify-content:center;align-items:center;padding:18px 0;position:relative;z-index:2;}

  .footer{margin-top:20px;margin-left:70px;padding-top:16px;border-top:1px solid rgba(27,42,58,0.25);display:flex;justify-content:space-between;font-size:14px;color:var(--slate);font-weight:600;position:relative;z-index:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="spine"></div>

  <div class="titleblock">
    <div class="titleline">FROM TOKEN<br>TO <span class="spark">FLEET</span></div>
    <div class="subtitle">The AI Solution Architect's Handbook</div>
  </div>

  <div class="stages">
    <div class="stage">
      <div class="stage-label"><div class="kicker">Macro · Fleet</div><div class="name" style="color:var(--slate)">Fleet</div></div>
      <div class="stage-scene">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="sq" style="width:70px;height:70px;border:2.5px solid var(--navy);border-radius:12px;background:#7C8A99"></div>
          <div class="sq" style="width:70px;height:70px;border:2.5px solid var(--navy);border-radius:12px;background:#E8651A"></div>
          <div class="sq" style="width:70px;height:70px;border:2.5px solid var(--navy);border-radius:12px;background:#148A99"></div>
          <div class="sq" style="width:70px;height:70px;border:2.5px solid var(--navy);border-radius:12px;background:#9AA7B3"></div>
        </div>
      </div>
    </div>

    <div class="loopwrap">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <g fill="none" stroke-width="9">
          <path d="M48 8 A40 40 0 0 1 88 48" stroke="#E8651A"/>
          <path d="M88 48 A40 40 0 0 1 48 88" stroke="#148A99"/>
          <path d="M48 88 A40 40 0 0 1 8 48" stroke="#5B6B7A"/>
          <path d="M8 48 A40 40 0 0 1 48 8" stroke="#E8651A"/>
        </g>
        <circle cx="48" cy="48" r="34" fill="#F4F1EA" stroke="#1B2A3A" stroke-width="1.5"/>
        <text x="48" y="43" text-anchor="middle" font-family="Inter" font-size="8" font-weight="900" fill="#101014">THE</text>
        <text x="48" y="54" text-anchor="middle" font-family="Inter" font-size="8" font-weight="900" fill="#101014">LOOP</text>
      </svg>
    </div>

    <div class="stage">
      <div class="stage-label"><div class="kicker">System</div><div class="name" style="color:var(--cyan)">Compute</div></div>
      <div class="stage-scene">
        <div style="display:flex;gap:16px;align-items:center">
          <div style="width:96px;height:58px;border:2.5px solid var(--navy);border-radius:12px;background:#E8651A;position:relative">
            <div style="position:absolute;inset:6px;border:1.5px dashed rgba(255,255,255,.7);border-radius:7px"></div>
            <div style="position:absolute;bottom:6px;left:6px;right:6px;height:6px;background:rgba(255,255,255,.5);border-radius:2px"></div>
          </div>
          <div style="width:96px;height:58px;border:2.5px solid var(--navy);border-radius:12px;background:#148A99;position:relative">
            <div style="position:absolute;top:6px;left:6px;right:6px;height:6px;background:rgba(255,255,255,.62);border-radius:2px"></div>
            <div style="position:absolute;top:16px;left:6px;right:6px;height:6px;background:rgba(255,255,255,.4);border-radius:2px"></div>
            <div style="position:absolute;top:26px;left:6px;right:6px;height:6px;background:rgba(255,255,255,.26);border-radius:2px"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="loopwrap" style="padding:10px 0">
      <div style="display:flex;align-items:center;gap:18px">
        <span style="font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.06em">CHARACTERIZE</span>
        <span style="font-size:13px;font-weight:900;color:var(--navy)">&rarr;</span>
        <span style="font-size:13px;font-weight:800;color:var(--cyan);letter-spacing:.06em">VALIDATE</span>
        <span style="font-size:13px;font-weight:900;color:var(--navy)">&rarr;</span>
        <span style="font-size:13px;font-weight:800;color:var(--slate);letter-spacing:.06em">RED-TEAM</span>
      </div>
    </div>

    <div class="stage">
      <div class="stage-label"><div class="kicker">Micro · Token</div><div class="name" style="color:var(--orange)">Token</div></div>
      <div class="stage-scene">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#E8651A"></div>
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#F08A4D"></div>
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#148A99"></div>
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#4FB4C0"></div>
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#9AA7B3"></div>
          <div style="width:36px;height:36px;border:2.5px solid var(--navy);border-radius:7px;background:#7C8A99"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>v20260831 · The AI Solution Architect's Handbook</span>
    <span>Zhiqi Tao</span>
  </div>
</div>
</body>
</html>
