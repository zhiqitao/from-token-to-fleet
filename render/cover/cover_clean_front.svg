<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="8.5in" height="11in">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F3EC"/>
      <stop offset="1" stop-color="#EDE7DA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8651A"/>
      <stop offset="1" stop-color="#148A99"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="850" height="1100" fill="url(#bg)"/>

  <!-- faint blueprint grid (very subtle, no text) -->
  <g stroke="#1B2A3A" stroke-width="1" opacity="0.045">
    <path d="M0,220 H850"/><path d="M0,440 H850"/><path d="M0,660 H850"/><path d="M0,880 H850"/>
    <path d="M212,0 V1100"/><path d="M425,0 V1100"/><path d="M637,0 V1100"/>
  </g>

  <!-- kicker -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" fill="#575B63" font-size="19" letter-spacing="6">
    <text x="78" y="132">A   I   ·   S   Y   S   T   E   M   S</text>
    <text x="78" y="162" font-size="15" fill="#8B9099" letter-spacing="4">ARCHITECTURE HANDBOOK</text>
  </g>

  <!-- title -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="900" fill="#101014" font-size="118" letter-spacing="-3">
    <text x="74" y="300">FROM TOKEN</text>
    <text x="74" y="424" fill="#1B2A3A">TO FLEET</text>
  </g>
  <rect x="76" y="452" width="150" height="8" fill="url(#accent)"/>

  <!-- subtitle -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" fill="#575B63" font-size="30">
    <text x="76" y="516">The AI Solution Architect's Handbook</text>
  </g>

  <!-- motif: token -> fleet abstraction (pure geometry, no labels) -->
  <g>
    <!-- flow path -->
    <path d="M110,700 C250,680 320,735 450,700 C580,665 640,720 740,690"
          fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- single token (far left) -->
    <rect x="78" y="668" width="64" height="64" rx="10" fill="#E8651A"/>
    <rect x="90" y="680" width="40" height="40" rx="6" fill="#F9C79A" opacity="0.9"/>

    <!-- teal growth clusters (middle) -->
    <g fill="#148A99" opacity="0.88">
      <rect x="352" y="664" width="34" height="34" rx="7"/>
      <rect x="392" y="664" width="34" height="34" rx="7"/>
      <rect x="352" y="704" width="34" height="34" rx="7"/>
    </g>
    <g fill="#148A99" opacity="0.6">
      <rect x="494" y="652" width="34" height="34" rx="7"/>
      <rect x="534" y="652" width="34" height="34" rx="7"/>
      <rect x="494" y="692" width="34" height="34" rx="7"/>
      <rect x="534" y="692" width="34" height="34" rx="7"/>
    </g>

    <!-- single navy fleet grid (right) -->
    <g fill="#1B2A3A" opacity="0.94">
      <rect x="632" y="646" width="46" height="54" rx="5"/>
      <rect x="684" y="646" width="46" height="54" rx="5"/>
      <rect x="736" y="646" width="46" height="54" rx="5"/>
      <rect x="632" y="706" width="46" height="54" rx="5"/>
      <rect x="684" y="706" width="46" height="54" rx="5"/>
      <rect x="736" y="706" width="46" height="54" rx="5"/>
      <rect x="632" y="766" width="46" height="54" rx="5"/>
      <rect x="684" y="766" width="46" height="54" rx="5"/>
      <rect x="736" y="766" width="46" height="54" rx="5"/>
    </g>

    <!-- connector from token to fleet (under motif) -->
    <path d="M110,760 C280,800 470,760 670,846" fill="none" stroke="#1B2A3A" stroke-width="3"
          stroke-linecap="round" opacity="0.3"/>

    <!-- small labels -->
    <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" fill="#E8651A" font-size="17">
      <text x="78" y="652">token</text>
    </g>
    <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" fill="#1B2A3A" font-size="17">
      <text x="700" y="626">fleet</text>
    </g>
  </g>

  <!-- author -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" fill="#101014" font-size="34">
    <text x="76" y="1020">Zhiqi Tao</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" fill="#8B9099" font-size="17">
    <text x="76" y="1054">First edition, 2026</text>
  </g>
</svg>
