# Canonical Scenario & Equation Set — single source of truth
# Every chapter's quantitative claims derive from here (book-architecture.md §14).
# Freeze this file; chapters cite it instead of re-inventing numbers.
# Version: v2  (2026-09-18 numerical-consistency baseline; ONE decimal convention)
#
# KV PER-TOKEN FORMULA — general form must be stated everywhere, not just the MHA case.
#   KV/token = 2 * n_layers * n_KV-heads * d_head * bytes
# MHA special case: n_KV-heads * d_head = d_model  (every query head has its own K,V),
#   so KV/token = 2 * n_layers * d_model * bytes.
# The canonical model below is a FULL-MHA reference model (hidden_dim = 8192 wide K/V).
#
# CANONICAL MODEL NAMING (critical, must be stated wherever 2.62 MB/token is quoted):
#   This is the "70B MHA reference model", NOT a claim about all 70B models.
#   2.62 MB/token is the full-MHA conservative upper-bound teaching baseline.
#   A GQA model with n_KV-heads=8 (e.g. LLaMA-2 70B: 64 query heads, 8 KV heads,
#   d_head=128) has KV/token = 2*80*(8*128)*2 = 2*80*1024*2 = 327,680 B ~ 0.328 MB/token,
#   i.e. about 8x smaller.
#
# CONVENTION (locked): ALL memory/compute arithmetic uses DECIMAL units (MB, GB, TFLOPS),
# because weight residency = 70e9 x 2 B / 1e9 = 140 GB is decimal. The KV per-token exact
# value is 2,621,440 B = 2.5 MiB = 2.62 MB (decimal); the book quotes "~2.5 MB/token" as a
# rounded shorthand, but every derived GB below follows the exact DECIMAL value.
#
# KV SIZING DISTINCTION (critical, must be stated everywhere):
#   - initial KV residency  = input tokens only (9,200)  -> 24.1 GB
#   - max end-of-generation= input + output (9,500)     -> 24.9 GB  <-- use for residency/concurrency
#
# FP8 KV: use the vLLM-measured ~54% of BF16 ratio [1P S6], NOT naive byte-halving.
#   FP8 @9.5K = 0.54 x 24.9 = 13.4 GB  -> 436/13.4 = ~33 concurrent.
#   NOTE: naive byte-halving gives 2,621,440/2 = 1,310,720 B ~ 1.31 MB/token (1.25 MiB),
#   ~12.4 GB @9,500. The manuscript uses the vLLM-measured 54% figure (1.42 MB, 13.4 GB)
#   as the operating FP8 number because that is what the serving stack actually achieves;
#   the naive 1.31 MB is the mathematical lower bound, not the shipped footprint.


scenario:
  name: "Enterprise Q&A over internal documents (RAG)"
  registered_users: 2000
  concurrency_factor: 0.05            # ~5% concurrently active
  requests_per_user_interval_s: 200   # one request ~every 200 s -> 10 rps avg
  peak_rps: 40
  prompt_tokens: 1200
  retrieved_context_tokens: 8000
  input_tokens: 9200                  # 1200 + 8000
  output_tokens: 300

model:
  params: 70e9                        # 70B-class dense
  precision_weights: "FP16"
  weight_bytes_per_param: 2           # FP16
  weight_gb: 140                      # = 70e9 * 2 / 1e9
  layers: 80
  hidden_dim: 8192                    # canonical full-MHA teaching model
  kv_heads: 8192                      # full MHA: H_kv * D_head = hidden_dim (=8192)
  head_dim: 1                         # so H_kv * D_head = hidden_dim
  kv_bytes_per_element: 2             # FP16 KV

hardware:
  host: "1 host, 8 x H100-class GPUs"
  gpus: 8
  hbm_per_gpu_gb: 80
  hbm_total_gb: 640
  runtime_reserve_gb: 64              # runtime/NCCL/activations on the 8xH100 host
  weights_gb: 140
  kv_budget_gb: 436                   # 640 - 140 - 64
  peak_tflops_fp16_per_gpu: 1000
  peak_flops_system: 8e15             # 8 x 1000 TFLOPS
  hbm_bandwidth_per_gpu_tbps: 3.35

equations:
  # 2 * layers * hidden_dim * kv_bytes = 2*80*8192*2 = 2,621,440 B
  kv_per_token_bytes: 2621440
  kv_per_token_mb_decimal: 2.62       # 2,621,440 / 1e6  (exact decimal)
  kv_per_token_mib: 2.5               # 2,621,440 / 2^20  (2.5 MiB; book shorthand)

latency_and_throughput:                # canonical service-time model (Ch 2, 8, 15, 20)
  ttft_s: 1.08                         # prefill time for 9.2K tokens
  tpot_ms_per_token: 25                # decode ms/token
  decode_s: 7.5                        # 300 output tokens x 25 ms
  service_time_s: 8.6                  # ttft + decode = 1.08 + 7.5 (Little's-law W)
  per_host_req_per_s_fp16: 2.0         # C/W = 17.5 / 8.6 = 2.03 (Little bound, FP16 KV; conservative)
  per_host_req_per_s_fp8: 3.8          # C/W = 32.4 / 8.6 = 3.77 (FP8 KV)

fleet_size:                            # Ch 17/20; provision for PEAK
  conv_in_flight_peak: 344             # 40 rps x 8.6 s
  n_hosts_avg: 5                       # ceil(10 x 8.6 / 17.5) = ceil(4.91); matches prefill avg
  n_hosts_peak_fp16: 20                # ceil(40 x 8.6 / 17.5) = ceil(19.66); matches prefill peak
  n_hosts_peak_fp16_70pct: 29          # ceil(40 x 8.6 / (17.5 x 0.7)) = ceil(28.08) = 29 (NOT 28)
  n_hosts_peak_fp8: 11                 # ceil(40 x 8.6 / 32.4)
  note: "Fleet size is max(throughput, KV, SLO); peaking on 40 rps, 8.6 s service time. C=17.5
        (byte-accurate 436/24.9037=17.51; conservative integer hard-fit floor = 17, NOT 18)."


derived:                              # computed by render/canonical_calc.py (DECIMAL GB)
  kv_9200_initial_gb: 24.1            # 9200 x 2.62 MB  (initial KV residency)
  kv_9500_max_gb: 24.9                # 9500 x 2.62 MB  (max end-of-generation KV)
  kv_300_output_gb: 0.8               # 300 x 2.62 MB
  kv_fp8_9500_gb: 13.4                # 0.54 x 24.9  (vLLM FP8 ~54% of BF16)
  inference_residency_9500_gb: 165    # 140 + 24.9  (=164.9 ~ 165; anchors)
  concurrency_fp16_9500: 17.5         # 436 / 24.9037 = 17.51 (NOT 18: a hard fit-ceiling
                                      #   cannot round up from 17.51; conservative integer floor = 17)
  concurrency_fp16_9500_floor: 17     # conservative integer "requests that fit" ceiling
  concurrency_fp8_9500: 32.4          # 436 / 13.448 = 32.4 (NOT 33; floor = 32)
  concurrency_fp8_9500_floor: 32
  kv_gqa_variant_mb: 0.33             # H_kv=8, D_head=128 -> 1024: 2*80*1024*2/1e6


# ---------------------------------------------------------------------------
# SCOPE-AWARE CAPACITY LEDGER (v3, 2026-09-19 — BLOCKER 1 fix)
# Every recurring quantity below carries an explicit SCOPE: per-GPU, per-host,
# per-fleet. This is the authoritative register that all chapters must cite
# (and must NOT re-derive independently). The two Ch8/Ch12 figures were
# regenerated from the SAME per-GPU -> per-host doubling (8x), which is why
# the corrected prefill sizing (~5 avg / ~19-20 peak) now agrees with the
# KV-residency/Little's-law fleet sizing.
# ---------------------------------------------------------------------------
scope_ledger:
  # --- H100 compute: PER-GPU ---
  h100_dense_peak_tflops_per_gpu: 989      # [1P] dense FP16, no sparsity
  h100_hbm_bw_tbps_per_gpu: 3.35           # [1P] SXM
  h100_ridge_flops_per_byte: 295           # 989 / 3.35 (scope-invariant ratio)
  h200_hbm_bw_tbps_per_gpu: 4.8
  h200_ridge_flops_per_byte: 206

  # --- prefill throughput ---
  prefill_tokens_per_s_PER_GPU: 2471       # 989*0.35/140e9  [analytical, 35% MFU]
  prefill_sustained_tflops_per_gpu: 346     # 989 x 0.35
  prefill_tokens_per_s_PER_HOST: 19770     # 8 x 2471  [idealized aggregate; before TP/system]
  prefill_sustained_pflops_per_host: 2.77  # 8 x 346

  # --- fleet sizing (reconciled across BOTH constraints) ---
  fleet_hosts_avg_prefill: 5               # ceil(92000/19770); matches Little avg
  fleet_hosts_peak_prefill: 20             # ceil(368000/19770) = 18.61 → 19 prefill-bound; kept at 20 to match the KV/Little peak (binding constraint)
  fleet_hosts_avg_kv_little: 5             # ceil(10*8.6/17.5)
  fleet_hosts_peak_kv_little: 20           # ceil(40*8.6/17.5)
  note: "Corrected 8x aggregate now AGREES with the KV/Little fleet sizing; formerly Ch8's
        37-node figure disagreed by 8x (it used the per-GPU 2,471 as per-node)."

