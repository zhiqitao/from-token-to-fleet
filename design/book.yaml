# From Token to Fleet: An AI Solution Architect's Handbook
#
# The REAL book project (clean restart 2026-08-29).
# Supreme authority: design/book-architecture.md (currently v8).
# This file mirrors the chapter skeleton in book-architecture.md §9.
# Version history lives in git, not in this file.
#
# Manuscript layout (by chapter, per Zhiqi 2026-08-29):
#   design/manuscript/chapter-NN/  -> each chapter is its own directory,
#     containing the body chapter-NN-<slug>.md plus a figures/ subdir.
#   Parts (I-VI) are a logical grouping only; the filesystem is flat by chapter.
#
# Evidence rule (binding, per book-architecture.md §5):
#   Source axis  [1P] first-party to subject (model card/vendor spec) / [2°] reputable second-hand / [VERIFY] not yet anchored
#   Claim axis   FACT directly stated by cited source / DERIVED calculated / HYPOTHESIS reasoned
# Home-lab experiments are NOT reference; [VERIFY] must resolve before publication.

book:
  title: "From Token to Fleet: An AI Solution Architect's Handbook"
  subtitle: "A learning resource for reasoning across the layers of an AI system"
  positioning: |
    First and foremost a learning tool the author wrote for himself, to build
    the systematic knowledge of what it means to work as an AI Solution
    Architect: how to reason across the layers of an AI system — from tokens
    and models to workloads, systems, infrastructure, and fleets — so that a
    vague requirement can be turned into a defensible architecture. If it
    helps anyone else build the same mental model, that is a bonus, above and
    beyond what the author set out to do.
  status: "living document — architecture defined, chapters grow incrementally"
  manuscript_root: design/manuscript

