<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="4.54in" viewBox="0 0 610 454" role="img" aria-labelledby="title desc">
<title id="title">mt-2-depth-execution</title><desc id="desc">One shared-weight rail supplies three core invocations. Each invocation has its own red history-cache slot. Below, an actual-stop lane executes passes 1 and 2 and leaves pass 3 unexecuted. A post-hoc lane executes all three passes before selecting the pass-2 representation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="610" height="454" fill="white"/>
<g font-family="DejaVu Sans"><text x="305" y="25" font-size="17" font-weight="bold" text-anchor="middle" fill="#202020">Shared weights do not remove executed work</text><rect x="80" y="48" width="450" height="30" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="305.0" y="68.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#202020">one shared core weight set</text><polyline points="130,78 130,105" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><rect x="65" y="109" width="130" height="36" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="130.0" y="132.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#202020">core pass 1</text><polyline points="196,127 242,127" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="130,147 130,171" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="175" width="130" height="40" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="130.0" y="191.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">iteration 1</text><text x="130.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">history cache</text><polyline points="310,78 310,105" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><rect x="245" y="109" width="130" height="36" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="310.0" y="132.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#202020">core pass 2</text><polyline points="376,127 422,127" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="310,147 310,171" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="175" width="130" height="40" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="310.0" y="191.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">iteration 2</text><text x="310.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">history cache</text><polyline points="490,78 490,105" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 4"/><rect x="425" y="109" width="130" height="36" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="490.0" y="132.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#202020">core pass 3</text><polyline points="490,147 490,171" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="425" y="175" width="130" height="40" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="490.0" y="191.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">iteration 3</text><text x="490.0" y="209.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">history cache</text><text x="305" y="240" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Separate iteration caches shown; sharing is not automatic</text><text x="305" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#202020">Exit after pass 2: two different runtime paths</text><text x="16" y="304" font-size="13" font-weight="bold" text-anchor="start" fill="#202020">Actual stop</text><text x="16" y="359" font-size="13" font-weight="bold" text-anchor="start" fill="#202020">Post-hoc</text><text x="16" y="377" font-size="13" font-weight="bold" text-anchor="start" fill="#202020">selection</text><rect x="160" y="287" width="80" height="31" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="200.0" y="307.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">pass 1</text><rect x="275" y="287" width="80" height="31" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="315.0" y="307.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">pass 2</text><rect x="390" y="287" width="80" height="31" rx="3" fill="white" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4"/><text x="430" y="308" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">pass 3</text><polyline points="241,302 272,302" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="349" width="80" height="31" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="200.0" y="369.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">pass 1</text><rect x="275" y="349" width="80" height="31" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="315.0" y="369.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">pass 2</text><rect x="390" y="349" width="80" height="31" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="430.0" y="369.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">pass 3</text><polyline points="241,364 272,364" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="356,364 387,364" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="430" y="338" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">not executed</text><rect x="492" y="287" width="103" height="31" rx="3" fill="#fff5df" stroke="#8a5700" stroke-width="1.3"/><text x="543.5" y="307.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">exit</text><polyline points="355,302 374,302 374,280 543,280 543,285" fill="none" stroke="#8a5700" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="492" y="349" width="103" height="42" rx="3" fill="#fff5df" stroke="#8a5700" stroke-width="1.3"/><text x="543.5" y="366.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">select pass 2</text><text x="543.5" y="384.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">after pass 3</text><polyline points="471,364 489,364" fill="none" stroke="#8a5700" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="305" y="408" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Dashed arrows = weight reuse; dashed box = not executed</text><text x="305" y="427" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Solid arrows = flow; labeled boxes mark exit / selection</text><text x="305" y="446" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Illustrative exit index; no latency or quality result</text></g></svg>