<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="6.0in" viewBox="0 0 610 600"><title>Figure V1 — Wan2.2 TI2V-5B whole-clip denoising. The T2V worked example starts from a 31×44×80×48 latent tensor and patchifies it into 27,280 video tokens. The fetched implementation uses T_l=(F−1)//4+1, H_l=H//16 and W_l=W//16. For aligned F=4k+1, F=1+4(T_l−1): 31 latent time positions correspond to 121 frames. The optional I2V branch is separate from the T2V budget. The feedback loop is denoising/scheduler iteration, not architectural recurrence. Fifty upstream timesteps use two CFG branch evaluations each. The VAE decode is not autoregressive text decode. [1P][FACT] geometry and loop; [1P][DERIVED] aligned inverse and token count. Schematic, not a latency or peak-memory measurement.</title><desc>Prompt encoding, labeled at most 512 prompt tokens, and optional reference-image VAE encoding condition a whole-clip denoising block. Initial FP32 latent noise enters from the right. The feedback loop is labeled denoising / scheduler iteration. The VAE stride is temporal 4 and spatial 16 by 16. The aligned endpoint formula 1+4 times (31 minus 1) gives 121 output frames at 1280 by 704 pixels and 24 frames per second. Solid data/state arrows and dashed conditioning arrows are distinct without color.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker></defs><rect width="610" height="600" fill="white"/><g font-family="Liberation Sans, sans-serif"><text id="t1" x="305" y="23" font-size="17" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Whole-clip denoising: Wan2.2 TI2V-5B</text><rect x="10" y="48" width="174" height="42" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t2" x="97" y="74" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Prompt</text><rect x="218" y="48" width="174" height="42" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t3" x="305" y="74" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Optional reference image</text><rect x="426" y="48" width="174" height="42" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t4" x="513" y="74" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Initial noise (FP32)</text><rect x="10" y="117" width="174" height="60" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t5" x="97" y="141" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">UMT5-XXL</text><text id="t6" x="97" y="163" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">≤512 prompt tokens</text><rect x="218" y="117" width="174" height="60" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t7" x="305" y="141" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">VAE encode</text><text id="t8" x="305" y="163" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">I2V condition only</text><rect x="426" y="117" width="174" height="60" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t9" x="513" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Latent: T × H × W × C</text><text id="t10" x="513" y="163" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">31 × 44 × 80 × 48</text><path id="a0" d="M 97,90 L 97,117" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><path id="a1" d="M 305,90 L 305,117" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><path id="a2" d="M 513,90 L 513,117" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="40" y="213" width="530" height="126" rx="5" fill="#FFF5EB" stroke="#E67E22" stroke-width="1.5"/><text id="t11" x="305" y="238" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Wan2.2 dense TI2V-5B + scheduler</text><text id="t12" x="305" y="265" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Patch (1, 2, 2): N = 27,280 video tokens</text><text id="t13" x="305" y="292" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">50 steps × 2 CFG branch evaluations</text><text id="t14" x="305" y="319" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Loop: denoising / scheduler iteration</text><path id="a3" d="M 97,177 L 97,195 L 124,195 L 124,213" fill="none" stroke="#27408B" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path id="a6" d="M 305,177 L 305,213" fill="none" stroke="#27408B" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path id="a7" d="M 513,177 L 513,213" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><path id="a8" d="M 570,240 L 591,240 L 591,323 L 570,323" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><path id="a11" d="M 305,339 L 305,373" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="105" y="373" width="400" height="86" rx="5" fill="#FFF5EB" stroke="#E67E22" stroke-width="1.5"/><text id="t15" x="305" y="397" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">VAE decode</text><text id="t16" x="305" y="420" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">VAE stride (T, H, W) = (4, 16, 16)</text><text id="t17" x="305" y="443" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Aligned endpoint: 1 + 4 × (31 − 1) = 121 frames</text><path id="a12" d="M 305,459 L 305,490" fill="none" stroke="#1A1A1A" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="153" y="490" width="304" height="44" rx="5" fill="#F1F4FA" stroke="#27408B" stroke-width="1.5"/><text id="t18" x="305" y="517" font-size="14" font-weight="normal" text-anchor="middle" fill="#1A1A1A">121 frames · 1280 × 704 · 24 fps</text><text id="t19" x="305" y="562" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Solid: data/state flow. Dashed: denoiser conditioning.</text><text id="t20" x="305" y="582" font-size="13" font-weight="normal" text-anchor="middle" fill="#1A1A1A">Token partitioning adds communication between devices.</text></g></svg>