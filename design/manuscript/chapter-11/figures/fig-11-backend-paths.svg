 stroke-width="1.7"/><line x1="505" y1="498" x2="505" y2="502" stroke="#20252A" stroke-width="1.7"/><polygon points="501,504 509,504 505,511" fill="#20252A"/><rect x="12" y="513" width="586" height="90" rx="4" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/><text x="305" y="535" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#20252A">Qualification gate: the complete model-serving configuration</text><text x="305" y="556" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">Weights + KV + workspace | operators + attention/cache path</text><text x="305" y="576" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">Correctness + isolation | collectives (if used) | measured SLO</text><text x="305" y="593" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#20252A">A visible device or a loaded model does not pass this gate.</text><text x="305" y="622" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">Conceptual dependency map. No cross-device API or feature equivalence implied.</text></svg>