<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="6.3in" viewBox="0 0 610 630"><rect width="610" height="630" fill="white"/><text x="305" y="26" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#20252A">Device visibility is not a validated serving path</text><text x="305" y="49" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">Solid: dependencies. Dashed: qualify the complete path.</text><text x="105" y="80" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#20252A">Intel GPU</text><rect x="12" y="98" width="186" height="78" rx="4" fill="#F5F5F3" stroke="#20252A" stroke-width="1.2"/><text x="105" y="118" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#20252A">Serving engine</text><text x="105" y="138" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">vLLM XPU / SGLang XPU</text><text x="105" y="156" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">or llama.cpp SYCL</text><rect x="12" y="204" width="186" height="72" rx="4" fill="#F5F5F3" stroke="#20252A" stroke-width="1.2"/><text x="105" y="224" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#20252A">Backend entry</text><text x="105" y="244" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">torch.xpu</text><text x="105" y="262" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#20252A">or engine-native SYCL</text><rect x="12" y="304" width="186" height="92" rx="4" fill="#F5F5F3" stroke="#20252A" stroke-width="1.2"/><text x="105" y="324" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" t