<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="439.2pt" height="252pt" viewBox="0 0 439.2 252" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="439.2" height="252" fill="#ffffff" />

  
  <text x="8" y="14" font-size="10" font-weight="bold" fill="#111" id="qa-text-0">LFM3-1.7B: tri-hybrid layer stack and decode-state scaling</text>
  <text x="8" y="25" font-size="8.5" fill="#555" id="qa-text-1">24 layers (config.json layer_types, cross-checked vs Liquid AI blog, 2026-10-27)</text>

  
  <text x="8" y="40" font-size="9" font-weight="bold" fill="#111" id="qa-text-2">Layer sequence (bottom of stack first): 13 conv + 5 SWA + 6 global attn</text>
  
  
  <g font-size="8.5" font-weight="bold" text-anchor="middle">
    
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="0.7">
      <rect x="8.0" y="45" width="16.4" height="16" /><rect x="25.4" y="45" width="16.4" height="16" />
      <rect x="60.199999999999996" y="45" width="16.4" height="16" /><rect x="95.0" y="45" width="16.4" height="16" />
      <rect x="129.79999999999998" y="45" width="16.4" height="16" /><rect x="164.6" y="45" width="16.4" height="16" />
      <rect x="199.39999999999998" y="45" width="16.4" height="16" /><rect x="234.2" y="45" width="16.4" height="16" />
      <rect x="269.0" y="45" width="16.4" height="16" /><rect x="303.79999999999995" y="45" width="16.4" height="16" />
      <rect x="338.59999999999997" y="45" width="16.4" height="16" /><rect x="373.4" y="45" width="16.4" height="16" />
      <rect x="408.2" y="45" width="16.4" height="16" />
    </g>
    
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="0.7">
      <rect x="42.8" y="45" width="16.4" height="16" />
      <rect x="112.39999999999999" y="45" width="16.4" height="16" />
      <rect x="182.0" y="45" width="16.4" height="16" />
      <rect x="251.59999999999997" y="45" width="16.4" height="16" />
      <rect x="321.2" y="45" width="16.4" height="16" />
      <rect x="390.79999999999995" y="45" width="16.4" height="16" />
    </g>
    
    <g fill="#fef3c7" stroke="#d97706" stroke-width="0.7">
      <rect x="77.6" y="45" width="16.4" height="16" />
      <rect x="147.2" y="45" width="16.4" height="16" />
      <rect x="216.79999999999998" y="45" width="16.4" height="16" />
      <rect x="286.4" y="45" width="16.4" height="16" />
      <rect x="356.0" y="45" width="16.4" height="16" />
    </g>
    
    <g fill="#1e40af">
      <text x="16.2" y="56.5" id="qa-text-3">C</text><text x="33.599999999999994" y="56.5" id="qa-text-4">C</text><text x="68.39999999999999" y="56.5" id="qa-text-5">C</text>
      <text x="103.2" y="56.5" id="qa-text-6">C</text><text x="137.99999999999997" y="56.5" id="qa-text-7">C</text><text x="172.79999999999998" y="56.5" id="qa-text-8">C</text>
      <text x="207.59999999999997" y="56.5" id="qa-text-9">C</text><text x="242.39999999999998" y="56.5" id="qa-text-10">C</text><text x="277.2" y="56.5" id="qa-text-11">C</text>
      <text x="311.99999999999994" y="56.5" id="qa-text-12">C</text><text x="346.79999999999995" y="56.5" id="qa-text-13">C</text><text x="381.59999999999997" y="56.5" id="qa-text-14">C</text>
      <text x="416.4" y="56.5" id="qa-text-15">C</text>
    </g>
    <g fill="#15803d">
      <text x="51.0" y="56.5" id="qa-text-16">G</text>
      <text x="120.6" y="56.5" id="qa-text-17">G</text>
      <text x="190.2" y="56.5" id="qa-text-18">G</text>
      <text x="259.79999999999995" y="56.5" id="qa-text-19">G</text>
      <text x="329.4" y="56.5" id="qa-text-20">G</text>
      <text x="398.99999999999994" y="56.5" id="qa-text-21">G</text>
    </g>
    <g fill="#b45309">
      <text x="85.8" y="56.5" id="qa-text-22">S</text>
      <text x="155.39999999999998" y="56.5" id="qa-text-23">S</text>
      <text x="224.99999999999997" y="56.5" id="qa-text-24">S</text>
      <text x="294.59999999999997" y="56.5" id="qa-text-25">S</text>
      <text x="364.2" y="56.5" id="qa-text-26">S</text>
    </g>
  </g>
  
  <g font-size="8.5">
    <rect x="8" y="65" width="10" height="10" fill="#dbeafe" stroke="#2563eb" stroke-width="0.7" />
    <text x="21" y="73.5" fill="#111" id="qa-text-27">C: short conv, k=7 (13)</text>
    <rect x="160" y="65" width="10" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="0.7" />
    <text x="173" y="73.5" fill="#111" id="qa-text-28">S: SWA, window 256 (5)</text>
    <rect x="290" y="65" width="10" height="10" fill="#dcfce7" stroke="#16a34a" stroke-width="0.7" />
    <text x="303" y="73.5" fill="#111" id="qa-text-29">G: global attn (6)</text>
  </g>

  
  <text x="8" y="90" font-size="9" font-weight="bold" fill="#111" id="qa-text-30">Every block: sandwich norm (in + out); attn layers add head-wise sigmoid gate</text>
  <text x="8" y="101" font-size="8.5" fill="#555" id="qa-text-31">G: half RoPE, theta 1e6; S: full RoPE, theta 1e4; 16 Q / 4 KV heads</text>

  
  <text x="8" y="118" font-size="9" font-weight="bold" fill="#111" id="qa-text-32">Decode state per layer type vs context length T</text>

  
  <g>
    <rect x="8" y="124" width="139" height="64" fill="#f8fafc" stroke="#2563eb" stroke-width="1" />
    <text x="14" y="137" font-size="8.5" font-weight="bold" fill="#1e40af" id="qa-text-33">C: conv (13 layers)</text>
    <text x="14" y="149" font-size="8.5" fill="#111" id="qa-text-34">fixed kernel-state buffer</text>
    <text x="14" y="160" font-size="8.5" fill="#111" id="qa-text-35">(kernel size 7)</text>
    <text x="14" y="174" font-size="8.5" font-weight="bold" fill="#111" id="qa-text-36">O(1): no KV cache</text>
    <text x="14" y="185" font-size="8.5" fill="#555" id="qa-text-37">conv_L_cache = 7</text>
  </g>
  
  <g>
    <rect x="150" y="124" width="139" height="64" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
    <text x="156" y="137" font-size="8.5" font-weight="bold" fill="#b45309" id="qa-text-38">S: SWA (5 layers)</text>
    <text x="156" y="149" font-size="8.5" fill="#111" id="qa-text-39">Retain 256 tokens</text>
    <text x="156" y="160" font-size="8.5" fill="#111" id="qa-text-40">if runtime crops cache</text>
    <text x="156" y="174" font-size="8.5" font-weight="bold" fill="#111" id="qa-text-41">O(1): 2.5 MiB total</text>
    <text x="156" y="185" font-size="8.5" fill="#555" id="qa-text-42">5 x 2 x 4 x 128 x 256 x 2B</text>
  </g>
  
  <g>
    <rect x="292" y="124" width="139" height="64" fill="#f8fafc" stroke="#16a34a" stroke-width="1" />
    <text x="298" y="137" font-size="8.5" font-weight="bold" fill="#15803d" id="qa-text-43">G: global attn (6 layers)</text>
    <text x="298" y="149" font-size="8.5" fill="#111" id="qa-text-44">full-context KV</text>
    <text x="298" y="160" font-size="8.5" fill="#111" id="qa-text-45">(GQA: 4 KV heads x 128)</text>
    <text x="298" y="174" font-size="8.5" font-weight="bold" fill="#111" id="qa-text-46">O(T): 12 KiB / token</text>
    <text x="298" y="185" font-size="8.5" fill="#555" id="qa-text-47">6 x 2 x 4 x 128 x 2B</text>
  </g>

  
  <rect x="8" y="196" width="423" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8" />
  <text x="14" y="209" font-size="8.5" fill="#111" id="qa-text-48">6 global layers: 12,288 B/token x 131,072 tokens = 1.611 GB (BF16)</text>
  <text x="14" y="221" font-size="8.5" fill="#111" id="qa-text-49">Vendor reports 1.6 GB at 128K; actual runtime allocation not tested here.</text>

  
  <text x="8" y="238" font-size="8.5" fill="#555" id="qa-text-50">Sources: Liquid AI blog (2026-10-27); HF config (retrieved 2026-10-28).</text>
  <text x="8" y="249" font-size="8.5" fill="#555" id="qa-text-51">Independent explanatory diagram, not vendor artwork. Post-2026-08-30 supplemental material.</text>
</svg>