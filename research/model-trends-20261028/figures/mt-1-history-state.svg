<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="3.95in" viewBox="0 0 610 395" role="img" aria-labelledby="title desc">
<title id="title">mt-1-history-state</title><desc id="desc">Three token-time columns show equal-sized recurrent-state boxes. Each state feeds the next recurrent update through a routed arrow. Below, a separate full-attention history grows from one to two to three KV cells. The recurrent and attention states belong to different layer groups.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="610" height="395" fill="white"/>
<g font-family="DejaVu Sans"><text x="305" y="25" font-size="17" font-weight="bold" text-anchor="middle" fill="#202020">Hybrid history: two state lifetimes</text><text x="305" y="49" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Schematic token snapshots; not a performance comparison</text><text x="130" y="81" font-size="14" font-weight="bold" text-anchor="middle" fill="#202020">token t1</text><polyline points="130,91 130,111" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="114" width="140" height="40" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="130.0" y="139.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">recurrent update</text><polyline points="130,155 130,180" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="184" width="140" height="44" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="130.0" y="202.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">state after t1</text><text x="130.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">fixed-size state</text><polyline points="201,206 220,206 220,134 237,134" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="111.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="130.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV1</text><text x="130" y="342" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">1 cached token</text><text x="310" y="81" font-size="14" font-weight="bold" text-anchor="middle" fill="#202020">token t2</text><polyline points="310,91 310,111" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="240" y="114" width="140" height="40" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="310.0" y="139.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">recurrent update</text><polyline points="310,155 310,180" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="240" y="184" width="140" height="44" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="310.0" y="202.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">state after t2</text><text x="310.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">fixed-size state</text><polyline points="381,206 400,206 400,134 417,134" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="289.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV1</text><rect x="312.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="331.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV2</text><text x="310" y="342" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">2 cached tokens</text><text x="490" y="81" font-size="14" font-weight="bold" text-anchor="middle" fill="#202020">token t3</text><polyline points="490,91 490,111" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="114" width="140" height="40" rx="3" fill="#eef3f8" stroke="#3a6ea5" stroke-width="1.3"/><text x="490.0" y="139.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">recurrent update</text><polyline points="490,155 490,180" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="184" width="140" height="44" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="490.0" y="202.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">state after t3</text><text x="490.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">fixed-size state</text><rect x="429.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="448.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV1</text><rect x="471.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="490.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV2</text><rect x="513.0" y="285" width="38" height="34" rx="3" fill="#fbefee" stroke="#b02a22" stroke-width="1.3"/><text x="532.0" y="307.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">KV3</text><text x="490" y="342" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">3 cached tokens</text><text x="305" y="248" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Successive state snapshots, not jointly retained history</text><text x="305" y="272" font-size="14" font-weight="bold" text-anchor="middle" fill="#202020">Full-attention layers: growing key/value (KV) history</text><text x="305" y="365" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Recurrent updates compute; state and KV boxes store</text><text x="305" y="386" font-size="13" font-weight="normal" text-anchor="middle" fill="#202020">Arrows = token input / state flow; snapshots are schematic</text></g></svg>