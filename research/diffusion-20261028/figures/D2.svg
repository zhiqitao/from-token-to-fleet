e="#E67E22" stroke-width="1.5" fill="none" marker-end="url(#orange)"/><text x="379" y="338" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">repeat evaluations</text><text x="18" y="419" font-size="16" font-weight="700" text-anchor="start" fill="#18212B">C  Block-causal diffusion: refine, commit, advance</text><rect x="20" y="452" width="110" height="40" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="75" y="469" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">causal</text><text x="75" y="487" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">prefix</text><path d="M 140 472 L 161 472" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="171" y="455" width="22" height="34" rx="3" fill="url(#hatch)" stroke="#27408B" stroke-width="1.3"/><text x="182" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">?</text><rect x="199" y="455" width="22" height="34" rx="3" fill="url(#hatch)" stroke="#27408B" stroke-width="1.3"/><text x="210" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">?</text><rect x="227" y="455" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="238" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><rect x="255" y="455" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="266" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><rect x="168" y="450" width="56" height="44" rx="3" fill="none" stroke="#E67E22" stroke-width="1.3" stroke-dasharray="5 3"/><path d="M 287 472 L 316 472" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="326" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="337" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">A</text><rect x="354" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="365" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">B</text><rect x="382" y="455" width="22" height="34" rx="3" fill="url(#hatch)" stroke="#27408B" stroke-width="1.3"/><text x="393" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">?</text><rect x="410" y="455" width="22" height="34" rx="3" fill="url(#hatch)" stroke="#27408B" stroke-width="1.3"/><text x="421" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">?</text><rect x="379" y="450" width="56" height="44" rx="3" fill="none" stroke="#E67E22" stroke-width="1.3" stroke-dasharray="5 3"/><path d="M 326 493 L 326 497 L 376 497 L 376 493" stroke="#27408B" stroke-width="2" fill="none"/><path d="M 442 472 L 471 472" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="481" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="492" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">A</text><rect x="509" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="520" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">B</text><rect x="537" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="548" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">C</text><rect x="565" y="455" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="576" y="478" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">D</text><path d="M 481 493 L 481 497 L 587 497 L 587 493" stroke="#27408B" stroke-width="2" fill="none"/><path d="M 426 494 L 426 513 L 388 513 L 388 494" stroke="#E67E22" stroke-width="1.5" fill="none" marker-end="url(#orange)"/><text x="379" y="536" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">repeat evaluations</text><text x="20" y="174" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Accepted IDs extend the prefix; K/V are cached when processed.</text><text x="20" y="195" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Solid brackets mark finalized prefix state, not just accepted IDs.</text><text x="20" y="361" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Full bidirectional forwards: fixed IDs can still acquire new K/V.</text><text x="20" y="382" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Here, accepted IDs stay fixed; prompt-state reuse is not assumed.</text><text x="20" y="558" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Refine the active block; finalize/cache its state before advancing.</text><text x="20" y="579" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">A valid block-causal boundary prevents later blocks changing it.</text><text x="18" y="610" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Letters = accepted IDs; hatched ? = unresolved; - = inactive future.</text><text x="18" y="632" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Dashed outline = recomputed output region; loops = repeated work.</text><text x="18" y="654" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Editing and renoising samplers can differ from these examples.</text></svg>
