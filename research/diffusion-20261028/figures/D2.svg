<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="6.65in" viewBox="0 0 610 665" font-family="Liberation Sans"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#FAFAFA"/><path d="M 0 6 L 6 0" stroke="#D0D0D0" stroke-width=".6"/></pattern><marker id="black" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 Z" fill="#18212B"/></marker><marker id="orange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6 Z" fill="#E67E22"/></marker></defs><rect x="0" y="0" width="610" height="665" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.3"/><text x="18" y="27" font-size="18" font-weight="700" text-anchor="start" fill="#18212B">Commit order and reusable state depend on the sampler</text><text x="18" y="52" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Snapshots show dependency order, not elapsed time or speedup.</text><text x="18" y="83" font-size="16" font-weight="700" text-anchor="start" fill="#18212B">A  Autoregressive: append one token</text><rect x="20" y="105" width="110" height="40" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="75" y="122" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">fixed</text><text x="75" y="140" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">prefix</text><path d="M 140 125 L 161 125" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="171" y="108" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="182" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">A</text><rect x="199" y="108" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="210" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><rect x="227" y="108" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="238" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><rect x="255" y="108" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="266" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><path d="M 171 146 L 171 150 L 193 150 L 193 146" stroke="#27408B" stroke-width="2" fill="none"/><path d="M 287 125 L 316 125" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="326" y="108" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="337" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">A</text><rect x="354" y="108" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="365" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">B</text><rect x="382" y="108" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="393" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><rect x="410" y="108" width="22" height="34" rx="3" fill="#F2F2F2" stroke="#27408B" stroke-width="1.3"/><text x="421" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">-</text><path d="M 326 146 L 326 150 L 376 150 L 376 146" stroke="#27408B" stroke-width="2" fill="none"/><path d="M 442 125 L 471 125" stroke="#18212B" stroke-width="2" fill="none" marker-end="url(#black)"/><rect x="481" y="108" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="492" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">A</text><rect x="509" y="108" width="22" height="34" rx="3" fill="#EFF3FA" stroke="#27408B" stroke-width="1.3"/><text x="520" y="131" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">B</text><rect x="537" y="108" width="