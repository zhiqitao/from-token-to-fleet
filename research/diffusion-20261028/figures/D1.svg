d="M 438 284 L 382 284" stroke="#E67E22" stroke-width="2" fill="none" marker-end="url(#orange)"/><text x="410.0" y="310" font-size="14" font-weight="400" text-anchor="middle" fill="#18212B">p<tspan baseline-shift="sub" font-size="80%">θ</tspan></text><text x="22" y="333" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">M = MASK; text states are illustrative token IDs, not generated results.</text><text x="18" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#18212B">Training: construct corrupted inputs; learn reverse predictions.</text><text x="18" y="395" font-size="15" font-weight="700" text-anchor="start" fill="#18212B">Sampling: start from the prior; apply learned reverse updates.</text><text x="18" y="425" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Flow matching learns a vector field on a chosen probability path.</text><text x="18" y="447" font-size="14" font-weight="400" text-anchor="start" fill="#18212B">Related paths do not make diffusion and flow matching identical.</text></svg>
