<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="4.33333333in" viewBox="0 0 439.2 312" role="img"><title>qf2-block-scale-bytes</title><desc>Same 32 E2M1 values use sixteen payload bytes. MXFP4 adds one block scale byte. Common one-dimensional NVFP4 adds two local scale bytes and a separate four-byte scale shared over the tensor. Byte accounting, not a physical packing order.</desc><rect width="100%" height="100%" fill="white"/>
<text x="118.918125" y="19" fill="#222222" font-family="Liberation Sans" font-size="12" font-weight="700" textLength="201.36374999999998" lengthAdjust="spacingAndGlyphs">Four-bit values, different scale bills</text>
<text x="99.27" y="38" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="400" textLength="240.66" lengthAdjust="spacingAndGlyphs">Payload and local-scale bar widths are proportional to bytes.</text>
<text x="24" y="62" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="700" textLength="179.35875" lengthAdjust="spacingAndGlyphs">MXFP4: one E8M0 scale per 32 values</text>
<rect x="24" y="73" width="288" height="26" fill="#dddddd" stroke="#444444" stroke-width="0.8"/>
<rect x="312" y="73" width="18" height="26" fill="#777777" stroke="#444444" stroke-width="0.8"/>
<text x="116.3709375" y="90" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="400" textLength="103.25812499999999" lengthAdjust="spacingAndGlyphs">32 E2M1 values = 16 B</text>
<text x="302.488125" y="112" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="400" textLength="37.02375" lengthAdjust="spacingAndGlyphs">1 B scale</text>
<line x1="321.0" y1="99" x2="321.0" y2="103" stroke="#444444" stroke-width="1"/>
<text x="24" y="132" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="700" textLength="231.96937499999999" lengthAdjust="spacingAndGlyphs">Local: 17 B / 32 = 0.53125 B/value = 4.25 bit/value</text>
<text x="24" y="157" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="700" textLength="244.65749999999997" lengthAdjust="spacingAndGlyphs">NVFP4 (common 1D): one E4M3 scale per 16 values</text>
<rect x="24" y="169" width="288" height="26" fill="#dddddd" stroke="#444444" stroke-width="0.8"/>
<line x1="168" y1="169" x2="168" y2="195" stroke="#444444" stroke-width="1"/>
<rect x="312" y="169" width="18" height="26" fill="#777777" stroke="#444444" stroke-width="0.8"/>
<rect x="330" y="169" width="18" height="26" fill="#777777" stroke="#444444" stroke-width="0.8"/>
<text x="61.532812500000006" y="186" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="400" textLength="68.93437499999999" lengthAdjust="spacingAndGlyphs">16 values = 8 B</text>
<text x="205.5328125" y="186" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="400" textLength="68.93437499999999" lengthAdjust="spacingAndGlyphs">16 values = 8 B</text>
<line x1="312" y1="195" x2="312" y2="199" stroke="#444444" stroke-width="1"/>
<line x1="348" y1="195" x2="348" y2="199" stroke="#444444" stroke-width="1"/>
<line x1="312" y1="199" x2="348" y2="199" stroke="#444444" stroke-width="1"/>
<text x="309.238125" y="212" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="400" textLength="41.52375" lengthAdjust="spacingAndGlyphs">2 B scales</text>
<text x="24" y="228" fill="#222222" font-family="Liberation Sans" font-size="10" font-weight="700" textLength="220.89187499999997" lengthAdjust="spacingAndGlyphs">Local: 18 B / 32 = 0.5625 B/value = 4.5 bit/value</text>
<text x="101.3053125" y="252" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="700" textLength="236.589375" lengthAdjust="spacingAndGlyphs">NVFP4 global FP32 scale: 4 B per tensor, not per block.</text>
<text x="118.5271875" y="279" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="400" textLength="202.145625" lengthAdjust="spacingAndGlyphs">Byte accounting only; not a physical packing order.</text>
<text x="92.5125" y="300" fill="#222222" font-family="Liberation Sans" font-size="9" font-weight="400" textLength="254.17499999999998" lengthAdjust="spacingAndGlyphs">No padding, extra copies, headers or high-precision exceptions.</text>
</svg>
