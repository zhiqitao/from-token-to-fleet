<svg xmlns="http://www.w3.org/2000/svg" width="6.1in" height="5.83333333in" viewBox="0 0 439.2 420" role="img"><title>qf1-quantization-layers</title><desc>Methods, representations, packed tensors, checkpoint container, runtime layout and compatible execution implementations. Unsupported combinations must be rejected; fallback is not guaranteed.</desc><rect width="100%" height="100%" fill="white"/>
